# Base configuration for the CCC-HawkingPoints pipeline.
# All paths are relative to the repo root. Override in a sibling config
# (e.g. configs/prod.yaml) for production runs — do not edit this file for
# one-off changes.

paths:
  data_raw: data/raw
  data_processed: data/processed
  masks: data/masks
  results_figures: results/figures
  results_tables: results/tables

# HEALPix resolutions used across multiscale feature extraction.
# The literature's Hawking-point scale (~1 deg) sits comfortably at nside=1024;
# 512 covers larger low-variance circles, 2048 matches the native Planck
# component-separation maps for the final cross-pipeline pass (Phase 8).
nside_list: [512, 1024, 2048]

# Ring-variance profile: annuli from 0 to max_radius_deg, uniform in angle.
# Default 8 bins to 2 deg matches the AMNP-2018 Hawking-point radial scale.
ring_stats:
  max_radius_deg: 2.0
  n_rings: 8

# Number of null simulations.
# n_dev is a fast sanity default; production calibration (Phase 7) requires
# n_prod >= 1000 to correctly estimate the tail of the map-wide-max distribution.
n_sims:
  dev: 200
  prod: 1000

# Master random seed — every stage derives its own stream from this to keep
# runs bit-reproducible across the six-stage pipeline.
seed: 20260705

# Placeholder beam FWHM (arcmin). Real values must be read from the download
# manifest (data/raw/MANIFEST.yaml) at run time — see CLAUDE.md Sec. 4.
beam_fwhm_arcmin_default: 5.0
